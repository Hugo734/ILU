; PlatformIO project for Node A -- Climate (DHT22 + fan). See docs/architecture.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; firmware/common is not a registered PlatformIO library -- it's this repo's own shared code
; (protocol, HMAC, transport). symlink:// tells PlatformIO's Library Dependency Finder to treat
; that local folder as a library dependency (it has its own library.json), so both nodes build
; against one copy instead of duplicating it. (lib_extra_dirs was tried first and silently
; ignored the folder -- it expects a directory *of* libraries, not the library itself.)
lib_deps =
    symlink://../common
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9

build_flags =
    ; PubSubClient's default 256-byte buffer is too small for a full `state` message once JSON
    ; keys + the HMAC signature are added (docs/protocol.md); 512 gives headroom without wasting
    ; much RAM on an ESP32 that has plenty.
    -D MQTT_MAX_PACKET_SIZE=512
