; PlatformIO project for Node B -- Soil (potentiometer standing in for a soil probe + pump). See
; docs/architecture.md. No DHT dependency here -- Node B's sensor is a plain analog read.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; See firmware/node_a/platformio.ini for why symlink:// is used instead of lib_extra_dirs.
lib_deps =
    symlink://../common
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
