# Installed into /etc/mosquitto/conf.d/ so the boards can reach the broker.
# Mosquitto 2.x listens only on localhost by default; the ESP32s are on the LAN.
listener 1883 0.0.0.0

# Prototype shortcut, deliberate: no username/password and no TLS. Acceptable
# on a private home network for a demo; a deployment would add a password file
# (mosquitto_passwd) and TLS on 8883.
allow_anonymous true
